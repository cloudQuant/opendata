# gitleaks configuration (A0.1 credential isolation)
#
# Design rule: allowlist only what is *provably* a placeholder or a generated
# artifact. Never allowlist a path just because it contains a real credential --
# remove the credential instead. A wide `^docs/` allowlist previously hid a real
# token literal in docs/evidence/; see docs/evidence/A0/secret-audit.txt §5.

[extend]
useDefault = true

[allowlist]
description = "Placeholder templates and generated build artifacts only."
paths = [
  # Committed template; holds placeholders like `change-me` by design.
  '''\.env\.example$''',
  # `pip install -e .` output (gitignored) embeds README curl examples.
  '''\.egg-info/''',
]

# Markdown documentation shows shell examples such as
# `curl -H "Authorization: Bearer <token>" ...`; only this noisy rule is exempt
# for markdown, so every other rule still scans docs and tests.
[[rules]]
id = "curl-auth-header"
[rules.allowlist]
description = "Docs show placeholder Authorization headers in curl examples."
paths = [
  '''\.md$''',
]

# C36: `generic-api-key` fires on SDMX *dataflow keys* - the public name of the
# statistic a provider asks for (`USA.UNEMP...PT_USR...Y15T64.UNE`,
# `Q.N.I9.W2...EUR.LR.N`), which travel in the request URL path, not a header. They
# are structural identifiers, and five of them have been in history since C14/C16.
#
# Scope is deliberately the tightest gitleaks offers: the captured *secret* must
# itself be an uppercase dotted key, so the exemption cannot be widened by
# coincidence - not by path, not by file type, not by the surrounding line. A real
# key written into one of these same files is still reported, which
# docs/evidence/C36/gitleaks-counterfactual.log re-proves on every round.
[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "Public SDMX dataflow keys name a statistic; they are not credentials."
regexTarget = "secret"
regexes = [
  '''^[A-Z0-9]{1,12}(\.[A-Z0-9_]{1,14}){3,}$''',
]
