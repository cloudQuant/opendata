# OpenBB 功能级全量内化的 provider 清单（自研，零源码复制）
#
# 上游基线：OpenBB/openbb_platform @ 3e071fcc2cd9f891cac6040ae60296dba76dab46
# 生成方式：解析各 provider 包的 Provider(fetcher_dict=...) 与 pyproject 依赖（只读形态事实，未复制源码）
# 规模：32 个 provider 目录 / 350 个 fetcher 模型（与 README §3「providers/*（32 个）」同一口径）
# 字段：batch=P0/P1/P2；scenario=消费场景（准入条件）；estimate_person_days=粗估人日（含上游对照）
#       credentials / sdk_dependencies = 上游 provider 的依赖名列表，无依赖者写 []
#       C33 之前这两种字段一共 64 处，没有一处是列表：34 处写的是裸 `-`（YAML 的序列标记而不是值，
#       ⇒ 整个文件不可解析，任何判据都读不回来）；21 处是裸标量（`sdk_dependencies: xmltodict`）、
#       9 处是一整条逗号串（`a, b, c`）——后两种**能**解析，只是解析成一个字符串：`len()` 数出 1 个
#       依赖、`"async-lru" in value` 退化成子串测试。models / credentials / sdk_dependencies /
#       rights_rows 四个名单字段一律写成列表，FIELD SHAPE 判据同时抓字符串与 null（键写了没值）。
#
# status 三态——README §5 把本文件指为批次进度准绳，故 status 是可判定的，不是备注：
#   待实现        注册表里没有该源的任何能力
#   已实现未对照  能力已注册、可按显式 source 调用，但没有真机逐字段对照记录 ⇒ 不参与 auto（A2.4/R2/R5）
#   已对照转正    该源**已注册的每条**能力都 verified 且参与 auto
# 两条读法上的约束：① status 只描述「我们注册了的那部分」，不代表上游 fetchers 全数内化——yfinance 行
# fetchers=29，本仓只注册 stock_daily_overseas 一条，故「已对照转正」≠「29/29 已完成」；②「某个源注册了
# 哪些域」的唯一事实是注册表（GET /api/v1/sources），本文件不复制一份能力清单，复制就会漂移（C23）。
# 判据实现：scripts/quality/openbb_inventory_plane.py（由 tests/test_openbb_inventory_guard.py 跑在门禁里）。
#
# rights_rows = 该源在 docs/data-rights-registry.md §1 登记表里的行名（AC-1 门禁 R3：未登记的源不得进
# source="auto"，故跟踪路由进度的文件必须能指回登记行）。
