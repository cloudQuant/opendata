# 合计粗估人日（32 provider）：153

# ---------------------------------------------------------------------------
# 本项目自有 / 搬运的源：它们不是 OpenBB 上游 provider，故不进上面的内化批次。
# 单列一节只为一件事：README §5 说「批次进度以本文件为准」，而注册表 33 条能力里有 21 条
# 来自这两个源（ths 11 + akshare 10）。它们在准绳里完全不存在时，这句话会被读成
# 「整个数据面还一条都没实现」——C33 之前的实际读数正是如此（32 行全写 待实现）。
# ---------------------------------------------------------------------------
local_providers:
  - provider: ths
    origin: 自研直连（opendata_fuyao，商业服务，需 X-api-key）
    scenario: A 股/ETF/期货/期权行情、标的目录、公司事件与交易日历（§7 真机场景的主源）
    requester: cloudQuant
    requester_purpose: 量化研究、回测与数据中台
    requester_confirmed_date: 2026-09-30
    requester_evidence: docs/evidence/C65/provider-requester-confirmation.json
    requester_confirmation_status: CONFIRMED
    registered_capability_count: 11
    auto_routable_capability_count: 11
    status: 已对照转正
    rights_rows: [同花顺扶摇 API]
    notes: >-
      11 条能力逐域与官方输出对照转正（C6/C9/C13/C14/C15/C20 等）。
      financial_indicator 有意**未**注册：契约 FinancialIndicator.announce_date 必填，
      而五类指标响应的 data.abilities 里没有披露日，半口径接线比留给退路更糟（C10 实测）。
  - provider: akshare
    origin: 搬运层 opendata_http（A2 里程碑 B 层）+ 自研模型层
    scenario: 国内公共 HTTP 退路（东方财富/新浪/腾讯/雪球/交易所/统计局）
    requester: cloudQuant
    requester_purpose: 量化研究、回测与数据中台
    requester_confirmed_date: 2026-09-30
    requester_evidence: docs/evidence/C65/provider-requester-confirmation.json
    requester_confirmation_status: CONFIRMED
    registered_capability_count: 10
    auto_routable_capability_count: 0
    status: 已实现未对照
    rights_rows: [东方财富, 新浪财经, 腾讯财经, 雪球, 交易所官网, 国家统计局]
    notes: >-
      10 条能力全部 verified=false，Capability.participates_in_auto() 因此为假，
      source="auto" 会跳过它们（registry.resolve 的 ranked 过滤）⇒ 国内域的 auto 腿今天只有
      ths 一条；"退路存在" 与 "退路可路由" 是两件事，C24 量的是前者。
      转正需要 AC-6 口径的真机逐字段对照，不是一行 status 改动。
