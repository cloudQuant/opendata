[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendata"
version = "0.1.0"
description = "opendata: multi-source financial data platform (ingestion, warehousing, REST/WS serving)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSL-1.1"}
authors = [
    {name = "cloud", email = "cloud@example.com"}
]
maintainers = [
    {name = "cloud", email = "cloud@example.com"}
]
keywords = ["opendata", "financial data", "market data", "quantitative trading", "data platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "openpyxl>=3.1.0",
    # The ported tree reads legacy .xls files (CSI index files) via
    # pandas.read_excel, which needs xlrd for the old binary format.
    "xlrd>=2.0.1",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "html5lib>=1.1",
    "jsonpath>=0.82",
    "tqdm>=4.66.0",
    "tabulate>=0.9.0",
    "scipy>=1.13.0",
    "decorator>=5.1.1",
    "mini-racer>=0.6.0",
    # opendata/data/domains.yaml and later mapping configs are YAML.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    # SQLAlchemy's async engine needs greenlet. SQLAlchemy only pulls it in for
    # specific platform_machine values, so macOS arm64 (Apple Silicon) misses it
    # and every async DB test dies with ValueError; declare it explicitly.
    "greenlet>=3.0",
    "alembic>=1.14.0",
    "pymysql>=1.1.1",
    "cryptography>=44.0.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.17",
    "apscheduler>=3.10.4",
    "croniter>=3.0.3",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "email-validator>=2.2.0",
    "slowapi>=0.1.9",
    "sqlalchemy-utils>=0.36.1",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.7",
    "DBUtils>=3.1.0",
    "bcrypt>=4.0.0",
    "redis>=5.0.0",
    "gunicorn>=22.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    # The ratchet gate (make quality-ratchet) pins these exact versions in
    # docs/quality/ratchet.json; a version drift fails the gate by design.
    # Upgrade deliberately: bump the pin, then `python scripts/quality/ratchet.py
    # --force-update` after reviewing the new counts.
    "ruff==0.15.20",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
]

# Install the platform:      pip install ".[web]"
# Install with dev tooling:  pip install ".[web,dev]"

[project.urls]
Homepage = "https://github.com/cloudQuant/opendata"
Repository = "https://github.com/cloudQuant/opendata"

[tool.setuptools.packages.find]
# Explicit list previously named only the two top-level packages, so
# opendata.api/core/... were never packaged (editable installs hid it).
# "akshare" is the vendored upstream source tree; it is renamed to
# opendata_http/ in milestone A2, after which it must be removed here.
include = ["opendata*", "opendata_http*"]

[tool.setuptools.package-data]
# §5.5: *.js must be explicit - the previous config missed it and wheels
# shipped without the ported site scripts. package-data patterns are
# per-package (no recursion), so subpackages with resources need their
# own entries.
opendata = ["py.typed", "data/authority.json", "data/domains.yaml"]
opendata_http = ["*.dat", "*.json", "*.js"]
"opendata_http.file_fold" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["akshare", "opendata_http", "alembic/versions", "frontend", ".venv", "htmlcov"]

[tool.ruff.lint]
# A2 layer runs the full set (quality spec §2.1); A1 debt is tracked by the
# ratchet snapshot instead of being grandfathered in the config.
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes (F821 undefined-name must NOT be ignored)
    "I",          # isort
    "N",          # pep8-naming
    "UP",         # pyupgrade
    "B",          # flake8-bugbear
    "C4",         # flake8-comprehensions
    "SIM",        # flake8-simplify
    "TC",         # flake8-type-checking
    "RUF100",     # unused noqa
    "S",          # flake8-bandit
    "PERF",       # perflint
    "ANN",        # type annotations
    "D",          # pydocstyle (Google style)
]
ignore = [
    # FastAPI's Depends() in default arguments is framework idiom; ignoring this
    # is explicitly sanctioned by the quality spec §2.1.
    "B008",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at class-creation time, so imports
# referenced by model fields must remain runtime imports; without this,
# TC002/TC003 would move them into TYPE_CHECKING and break pydantic.
# Matching is by the base's qualified name as imported, so all import
# forms of the contract base are listed.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "ContractModel",
    "opendata.data.models.base.ContractModel",
    "opendata.data.models.ContractModel",
]

[tool.ruff.lint.per-file-ignores]
# C layer: tests keep the full rule set minus security-smell and annotation rules.
"tests/*" = ["B017", "N806", "S1", "S2", "ANN", "D"]
# B layer: ported akshare code is checked for syntax/undefined names only.
"akshare/**" = ["E501"]
# Dynamic DDL for regex-validated identifiers (safe_table_name/safe_column_name,
# ^[A-Za-z_][A-Za-z0-9_]*$) - same rationale as bandit.yaml's B608 skip.
"opendata/services/data_acquisition.py" = ["S608"]
# ods writer DDL/DML builders: every identifier passes _quote()'s word-character
# whitelist (Unicode letters allowed for source column names, backticks and
# separators refused) and every value is a bind parameter.
"opendata/pipeline/ods_writer.py" = ["S608"]
# Legacy dynamic typing (upstream SDK calls, APScheduler jobs) — Any is intentional.
"opendata/data_fetch/providers/akshare_provider.py" = ["ANN401", "S608"]
"opendata/data_fetch/scripts/*" = ["ANN401"]
"opendata/services/scheduler_service.py" = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["akshare", "opendata_http", "tests", "alembic", "opendata/data_fetch"]

# A1 debt is managed by docs/quality/ratchet.json (quality spec §7), not by
# relaxing the rules above.

# A2.2: the ported tree replaces akshare/; mypy's exclude does not stop
# import-following, so silence it explicitly like the old vendored tree.
[[tool.mypy.overrides]]
module = "opendata_http.*"
follow_imports = "skip"

# A1 legacy zone: data_fetch stays mypy-dark (mirrors the exclude above);
# touched files still enter the A2 ruff/bandit gates on touch.
[[tool.mypy.overrides]]
module = "opendata.data_fetch.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "opendata.data_fetch.*"
follow_imports = "skip"

[tool.coverage.run]
source = ["opendata"]
omit = ["opendata/__init__.py", "tests/*"]
branch = true

[tool.coverage.report]
fail_under = 84
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
