[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendata"
version = "0.1.0"
description = "opendata: multi-source financial data platform (ingestion, warehousing, REST/WS serving)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSL-1.1"}
authors = [
    {name = "cloud", email = "cloud@example.com"}
]
maintainers = [
    {name = "cloud", email = "cloud@example.com"}
]
keywords = ["opendata", "financial data", "market data", "quantitative trading", "data platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    # C36: the ported tree is imported through
    # opendata/data/providers/akshare/_vendor/__init__.py, upstream akshare's eager
    # facade (306 ported modules land in sys.modules for a
    # plain `import opendata.main`), so every third-party library that facade touches
    # at import time is a *runtime* dependency of this project. curl_cffi and urllib3
    # were missing; CI failed on `ModuleNotFoundError: curl_cffi` for five pushes.
    # Guard: tests/test_ported_import_closure.py.
    # The ported code only uses the `requests.Session()` compatibility layer (no
    # `impersonate=`), and this round exercised curl_cffi 0.13.0.
    "curl_cffi>=0.7.0",
    # Imported directly by modules under the nested vendor package.
    "urllib3>=2.0.7",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "defusedxml>=0.7.1",
    "lxml>=5.0.0",
    "openpyxl>=3.1.0",
    # The ported tree reads legacy .xls files (CSI index files) via
    # pandas.read_excel, which needs xlrd for the old binary format.
    "xlrd>=2.0.1",
    "pandas>=2.2.3",
    # A3.3: market-dumps are Parquet; parsing needs an engine even though it is
    # imported lazily so environments without it can still run the other paths.
    "pyarrow>=15.0.0",
    "numpy>=2.1.3",
    "html5lib>=1.1",
    "jsonpath>=0.82",
    "tqdm>=4.66.0",
    "tabulate>=0.9.0",
    "scipy>=1.13.0",
    "decorator>=5.1.1",
    "mini-racer>=0.6.0",
    # opendata/data/domains.yaml and later mapping configs are YAML.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Per-source SDK extras (FR-7: provider SDKs stay optional; providers fail
# closed with a stable code when the extra is not installed).
providers = [
    "yfinance>=0.2.40",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    # Keep the async runtime's greenlet requirement explicit for macOS arm64;
    # the SQLAlchemy asyncio extra above also requests it through package metadata.
    "greenlet>=3.0",
    "alembic>=1.14.0",
    "pymysql>=1.1.1",
    "cryptography>=44.0.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.17",
    "apscheduler>=3.10.4",
    "croniter>=3.0.3",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "email-validator>=2.2.0",
    "slowapi>=0.1.9",
    "sqlalchemy-utils>=0.36.1",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.7",
    "DBUtils>=3.1.0",
    "bcrypt>=4.0.0",
    "redis>=5.0.0",
    "gunicorn>=22.0.0",
]
dev = [
    # AC-14|02 consumer acceptance runs a small backtrader backtest; this is
    # test-only and deliberately leaves the consumer's supported version open.
    "backtrader",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    # The ratchet gate (make quality-ratchet) pins these exact versions in
    # docs/quality/ratchet.json; a version drift fails the gate by design.
    # Upgrade deliberately: bump the pin, then `python scripts/quality/ratchet.py
    # --force-update` after reviewing the new counts.
    "ruff==0.15.20",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
]

# Install the platform:      pip install ".[web]"
# Install with dev tooling:  pip install ".[web,dev]"

[project.urls]
Homepage = "https://github.com/cloudQuant/opendata"
Repository = "https://github.com/cloudQuant/opendata"

[tool.setuptools.packages.find]
# Discover the application package and its subpackages. The independent
# opendata_client distribution lives beside it and is intentionally separate.
include = ["opendata", "opendata.*"]

[tool.setuptools.package-data]
# §5.5: *.js must be explicit - the previous config missed it and wheels
# shipped without the ported site scripts. package-data patterns are
# per-package (no recursion), so subpackages with resources need their
# own entries.
opendata = [
    "py.typed",
    "data/authority.json",
    "data/domains.yaml",
    "data/openbb_map.yaml",
    "data/mappings/*.yaml",
    "pipeline/schedules.yaml",
]
"opendata.data.providers.akshare._vendor" = [
    "*.dat",
    "*.json",
    "*.js",
    "*.lock",
    "LICENSE-AKSHARE",
]
"opendata.data.providers.akshare._vendor.file_fold" = ["calendar.json"]
"opendata.data.providers.akshare._vendor.stock_feature" = ["ths.js"]
"opendata.data.providers.ths" = ["*.yaml"]
"opendata.data.providers.ths.transport" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    # C35: a pattern without a slash is matched against *any* directory
    # basename at any depth, so the old bare "akshare" also swallowed the
    # first-party package opendata/data/providers/akshare/ - 15 modules were
    # dark to `ruff check opendata`. Every entry below is root-anchored (the
    # trailing slash is what anchors it; "/akshare" matches nothing at all).
    # The nested upstream package has a separate E/F audit. The first-party
    # AkShare adapter beside it remains in this walk.
    "opendata/data/providers/akshare/_vendor/",
    # C45: alembic/ and alembic_data/ used to be excluded on the stated
    # rationale "revision files are tool-generated scaffolding". That is not
    # what they are: alembic_data/versions/*.py are hand-written modules that
    # *import* the DDL builders from opendata/pipeline/ddl (only the SQL text
    # is generated), and alembic/versions/0002-0003 were authored by hand. No
    # generator rewrites these files, so excluding them hid 10 first-party
    # modules from every static plane while the A2 "touch it, meet it" rule
    # claimed otherwise. They are in scope now; their 28 violations and one
    # unformatted file were fixed instead (DDL proven byte-identical).
    "frontend/",
    ".venv",
    "htmlcov",
]

[tool.ruff.lint]
# A2 layer runs the full set (quality spec §2.1); A1 debt is tracked by the
# ratchet snapshot instead of being grandfathered in the config.
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes (F821 undefined-name must NOT be ignored)
    "I",          # isort
    "N",          # pep8-naming
    "UP",         # pyupgrade
    "B",          # flake8-bugbear
    "C4",         # flake8-comprehensions
    "SIM",        # flake8-simplify
    "TC",         # flake8-type-checking
    "RUF100",     # unused noqa
    "S",          # flake8-bandit
    "PERF",       # perflint
    "ANN",        # type annotations
    "D",          # pydocstyle (Google style)
]
ignore = [
    # FastAPI's Depends() in default arguments is framework idiom; ignoring this
    # is explicitly sanctioned by the quality spec §2.1.
    "B008",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at class-creation time, so imports
# referenced by model fields must remain runtime imports; without this,
# TC002/TC003 would move them into TYPE_CHECKING and break pydantic.
# Matching is by the base's qualified name as imported, so all import
# forms of the contract base are listed.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "ContractModel",
    "opendata.data.models.base.ContractModel",
    "opendata.data.models.ContractModel",
]

[tool.ruff.lint.per-file-ignores]
# C layer: tests keep the full rule set minus security-smell and annotation rules.
"tests/*" = ["B017", "N806", "S1", "S2", "ANN", "D"]
# C35 removed the B layer's `"akshare/**" = ["E501"]`. Unlike [tool.ruff].exclude,
# these patterns are matched relative to the project root (measured: "akshare/**"
# silences akshare/** but *not* opendata/data/providers/akshare/**), so the entry
# had been matching nothing since milestone A2 renamed the top-level akshare/ to
# opendata_http/ - the provider package never got the line-length relaxation.
# Dynamic DDL for regex-validated identifiers (safe_table_name/safe_column_name,
# ^[A-Za-z_][A-Za-z0-9_]*$) - same rationale as bandit.yaml's B608 skip.
"opendata/services/data_acquisition.py" = ["S608"]
# ods writer DDL/DML builders: every identifier passes _quote()'s word-character
# whitelist (Unicode letters allowed for source column names, backticks and
# separators refused) and every value is a bind parameter.
"opendata/pipeline/ods_writer.py" = ["S608"]
# dq_diff_report insert: column names come from the module's REPORT_COLUMNS
# constant and every value is a bind parameter.
"opendata/pipeline/diff_report.py" = ["S608"]
# Query builders: identifiers pass the word-character whitelist before quoting
# and every value (symbols included) is a bind parameter; S608 flags the
# f-strings that assemble those validated identifiers.
"opendata/pipeline/query.py" = ["S608"]
"opendata/api/data_query.py" = ["S608"]
# page_sql builds ORDER BY from inspector-validated column names and binds the
# pagination values; S608 flags the f-string that assembles those identifiers.
"opendata/pipeline/table_page.py" = ["S608"]
# Retention purge/export: table and column names pass _identifier()'s
# word-character whitelist before quoting, and the cutoff is a bind parameter.
"opendata/pipeline/retention.py" = ["S608"]
# /tables export and metadata queries: table names come from _get_safe_table_name
# (safe_table_name validates ^[A-Za-z_][A-Za-z0-9_]*$) and page ordering goes
# through page_sql; every value is a bind parameter.
"opendata/api/tables.py" = ["S608"]
# Legacy dynamic typing (upstream SDK calls, APScheduler jobs) — Any is intentional.
"opendata/data_fetch/providers/akshare_provider.py" = ["ANN401", "S608"]
"opendata/data_fetch/scripts/*" = ["ANN401"]
"opendata/services/scheduler_service.py" = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
# The consumer client is a sibling package (design §10.4), not a dependency
# of the app: mypy needs the same path pytest uses to resolve it.
mypy_path = "opendata_client"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
# Mypy matches this list with re.search, so the vendor exclusion must name the
# exact package prefix and leave the first-party adapter in scope.
# C45: ^alembic/ and ^alembic_data/ were dropped together with the ruff
# entries above; the walk over both roots measures 0 errors.
exclude = [
    "^opendata/data/providers/akshare/_vendor/",
    "^tests/",
    "^opendata/data_fetch/",
]

# A1 debt is managed by docs/quality/ratchet.json (quality spec §7), not by
# relaxing the rules above.

# Mypy excludes do not stop import-following, so silence imports from the
# nested vendor package explicitly as well.
[[tool.mypy.overrides]]
module = [
    "opendata.data.providers.akshare._vendor",
    "opendata.data.providers.akshare._vendor.*",
]
follow_imports = "skip"

# A1 legacy zone: data_fetch stays mypy-dark (mirrors the exclude above);
# touched files still enter the A2 ruff/bandit gates on touch.
[[tool.mypy.overrides]]
module = "opendata.data_fetch.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "opendata.data_fetch.*"
follow_imports = "skip"

[tool.coverage.run]
# 与 pytest.ini 的 --cov 保持一致（命令行优先级更高）：只改这里不会生效，
# 裸 `coverage run -m pytest` 才会读到本行。
source = ["opendata"]
omit = [
    "opendata/__init__.py",
    "opendata/data/providers/akshare/_vendor/*",
    "tests/*",
]
branch = true

[tool.coverage.report]
fail_under = 84
# 阈值比较按两位小数进行：coverage 默认 precision=0 会把 83.96% 四舍五入成 84%
# 判定通过，而 pytest 终端摘要仍按原始值打印 "FAIL ... not reached"，
# 于是出现过"门禁打印 FAIL、make 退出 0"的假绿（C6 轮实测）。
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
