name: CI

on:
  push:
    branches: [dev, master, "feature/**", "fix/**", "docs/**", "refactor/**", "test/**"]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The scanner release is *not* pinned here: docs/quality/secret-scan.json is the
  # single source of truth, because CI on 8.21.2 and this machine on 8.30.1 produced
  # two different findings sets for the same tree (C36). `make secret-check` re-checks
  # the installed binary against that manifest and fails on drift.
  secret-scan:
    name: secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gitleaks (version from docs/quality/secret-scan.json)
        run: |
          VERSION=$(python -c "import json;print(json.load(open('docs/quality/secret-scan.json'))['gitleaks_version'])")
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan git history for credentials
        run: make secret-check

  quality-gate:
    name: quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: opendata
          MYSQL_USER: opendata_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # Metadata database (main)
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: opendata_user
      MYSQL_PASSWORD: ci_password
      MYSQL_DATABASE: opendata
      # Data warehouse
      DATA_MYSQL_HOST: 127.0.0.1
      DATA_MYSQL_PORT: "3306"
      DATA_MYSQL_USER: opendata_user
      DATA_MYSQL_PASSWORD: ci_password
      DATA_MYSQL_DATABASE: opendata_data
      # Non-secret CI-only values
      SECRET_KEY: ci-only-secret-key
      APP_ENV: testing
      ENABLE_SCHEDULER: "false"
      SCHEDULER_BOOTSTRAP_ON_STARTUP: "false"
      PYTHONUNBUFFERED: "1"
      # On pull requests, diff the A2 gate against the target branch's merge base.
      # On pushes this is empty, so a2-check falls back to docs/quality/baseline.json.
      A2_BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a2-check resolves the baseline commit by SHA, so the full history is required.
          fetch-depth: 0

      - name: Fetch PR base branch (A2 gate needs it as a diff base)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev,providers]"

      - name: Fetch pinned upstream metadata checkout
        run: |
          COMMIT=$(python -c "from scripts.quality.provider_model_inventory import UPSTREAM_COMMIT; print(UPSTREAM_COMMIT)")
          CHECKOUT="$RUNNER_TEMP/opendata-openbb"
          git init "$CHECKOUT"
          git -C "$CHECKOUT" fetch --depth=1 https://github.com/OpenBB-finance/OpenBB.git "$COMMIT"
          git -C "$CHECKOUT" checkout --detach FETCH_HEAD
          test "$(git -C "$CHECKOUT" rev-parse HEAD)" = "$COMMIT"
          printf 'OPENDATA_OPENBB_PATH=%s/openbb_platform\n' "$CHECKOUT" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install earlyoom (memory exhaustion must fail a named process, not freeze the runner)
        run: |
          sudo apt-get install -y -qq earlyoom || (sudo apt-get update -qq && sudo apt-get install -y -qq earlyoom)
          sudo systemctl disable --now earlyoom

      - name: Pull pinned MySQL image for owned browser integration
        run: |
          IMAGE=$(python -c "from tests.script_download_backend_harness import MYSQL_IMAGE_REFERENCE; print(MYSQL_IMAGE_REFERENCE)")
          docker pull "$IMAGE"

      - name: Install gitleaks (gate runs secret-check; version from the manifest)
        run: |
          VERSION=$(python -c "import json;print(json.load(open('docs/quality/secret-scan.json'))['gitleaks_version'])")
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Create data warehouse database
        run: |
          python - <<'PY'
          import pymysql
          conn = pymysql.connect(
              host="127.0.0.1", port=3306, user="root", password="ci_root_password"
          )
          with conn.cursor() as cur:
              cur.execute(
                  "CREATE DATABASE IF NOT EXISTS opendata_data "
                  "CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
              )
          conn.commit()
          conn.close()
          print("opendata_data is ready")
          PY

      - name: Verify metadata migrations apply on MySQL
        run: alembic upgrade head

      - name: Verify migrations match the models (no drift)
        run: alembic check

      - name: Run fail-closed quality gate
        timeout-minutes: 100
        run: |
          # The gate's own output goes to a file that is uploaded afterwards; the Actions
          # pipe only ever sees one short heartbeat line per 30s. Runs 40000463253,
          # 40014879802 and 40040759684 each went silent at 8.43 MB of job log - mid
          # test-cov, with xdist, this monitor and earlyoom's 60s status all stopping in
          # the same second while memory, disk and load stayed healthy - and then sat
          # there until the 120m job limit killed them. One line per collected test is
          # what filled the log. A stalled gate must name the member it stalled in.
          LOG="${{ runner.temp }}/gate.log"
          : > "$LOG"
          heartbeat() {
            set +e +o pipefail
            local started=$SECONDS
            while sleep 30; do
              local elapsed=$(( SECONDS - started )) size
              size=$(( $(stat -c%s "$LOG" 2>/dev/null || echo 0) / 1024 ))
              printf '[beat %dm%02ds] log=%dKB member=%s tail=%s mem=%sMB procs=%s load=%s\n' \
                "$(( elapsed / 60 ))" "$(( elapsed % 60 ))" "$size" \
                "$(grep -a '===== gate:' "$LOG" | tail -n 1 | sed -e 's/.*gate: //' -e 's/ =====.*//')" \
                "$(LC_ALL=C tail -c 90 "$LOG" | tr -cd '[:print:]' | tr '#' '_' | tr '\n' ' ')" \
                "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)" \
                "$(ps -e --no-headers | wc -l)" \
                "$(cut -d' ' -f1 /proc/loadavg)"
            done
          }
          heartbeat &
          heartbeat_pid=$!
          # Process names only in the log: command lines can carry the owned-MySQL harness's
          # generated passwords, so nothing here echoes a full argv.
          sudo earlyoom -r 60 -m 8,4 -s 100,100 -p \
            --avoid '^(Runner\.Worker|Runner\.Listener|provjobd[0-9]*|dockerd|containerd|mysqld|systemd.*|earlyoom)$' \
            >> "$LOG" 2>&1 &
          earlyoom_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null; sudo kill "$earlyoom_pid" 2>/dev/null; true' EXIT
          status=0
          make gate > "$LOG" 2>&1 || status=$?
          set +e +o pipefail
          kill "$heartbeat_pid" 2>/dev/null
          sudo kill "$earlyoom_pid" 2>/dev/null
          echo "===== gate finished with status $status ====="
          echo "::group::gate member progress"
          grep -aE '^===== gate:|^Required test coverage|^TOTAL|passed.*[0-9]+s$|Test failed' "$LOG" | tail -n 40
          echo "::endgroup::"
          echo "::group::failing member output"
          last_marker=$(grep -an '===== gate:' "$LOG" | tail -n 1 | cut -d: -f1)
          sed -n "${last_marker:-1},\$p" "$LOG" | tail -n 250 | cut -c1-500
          echo "::endgroup::"
          free -m
          df -h / | sed -n '2p'
          exit "$status"

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: ${{ runner.temp }}/gate.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Runner diagnostics after the gate
        if: always()
        run: |
          set +e +o pipefail
          free -m
          df -h /
          sudo dmesg -T | grep -iE 'out of memory|oom-kill|killed process' | tail -n 20
          ps -eo pid=,ppid=,nlwp=,rss=,etimes=,comm= --sort=-rss | sed -n '1,15p'
