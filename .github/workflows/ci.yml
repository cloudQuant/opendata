name: CI

on:
  push:
    branches: [dev, master, "feature/**", "fix/**", "docs/**", "refactor/**", "test/**"]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      sync_acceptance_ratchet:
        type: boolean
        default: false
        description: >-
          Measure the acceptance probe in this job's environment and rewrite
          docs/quality/acceptance-gate-ratchet.json for review as an artifact,
          instead of running the gate. Use only after the owner adjudicated a
          ratchet entry; the file is never committed by CI.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The scanner release is *not* pinned here: docs/quality/secret-scan.json is the
  # single source of truth, because CI on 8.21.2 and this machine on 8.30.1 produced
  # two different findings sets for the same tree (C36). `make secret-check` re-checks
  # the installed binary against that manifest and fails on drift.
  secret-scan:
    name: secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gitleaks (version from docs/quality/secret-scan.json)
        run: |
          VERSION=$(python -c "import json;print(json.load(open('docs/quality/secret-scan.json'))['gitleaks_version'])")
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan git history for credentials
        run: make secret-check

  quality-gate:
    name: quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: opendata
          MYSQL_USER: opendata_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # A manual `sync_acceptance_ratchet` dispatch measures and uploads the ratchet
      # baseline instead of running the gate; the two conditions below read one flag.
      SYNC_ACCEPTANCE_RATCHET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_acceptance_ratchet == 'true' }}
      # Metadata database (main)
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: opendata_user
      MYSQL_PASSWORD: ci_password
      MYSQL_DATABASE: opendata
      # Data warehouse
      DATA_MYSQL_HOST: 127.0.0.1
      DATA_MYSQL_PORT: "3306"
      DATA_MYSQL_USER: opendata_user
      DATA_MYSQL_PASSWORD: ci_password
      DATA_MYSQL_DATABASE: opendata_data
      # Non-secret CI-only values
      SECRET_KEY: ci-only-secret-key
      APP_ENV: testing
      ENABLE_SCHEDULER: "false"
      SCHEDULER_BOOTSTRAP_ON_STARTUP: "false"
      PYTHONUNBUFFERED: "1"
      # On pull requests, diff the A2 gate against the target branch's merge base.
      # On pushes this is empty, so a2-check falls back to docs/quality/baseline.json.
      A2_BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a2-check resolves the baseline commit by SHA, so the full history is required.
          fetch-depth: 0
          # On a pull_request run the default ref is GitHub's synthetic merge commit, so the gate
          # would judge a tree nobody ships. Measuring the head branch gives the run the tree the
          # merge will land (same-repo PRs always have that branch in origin, and the diff-based
          # members name their own base through A2_BASE_REF). This is about the *tree*, not the
          # history: run 41335236551 measured this repo complete at gate start
          # (`shallow=false head_commits=976`) and truncated at gate end (`shallow=true head=5`),
          # while run 41335493770 read AC-16|09 proven on the default merge ref. Neither the
          # checkout ref nor a pre-gate unshallow moves those cells - the gate run itself changes
          # the repository under them, which is what the two shape prints are for.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}

      - name: Fetch PR base branch (A2 gate needs it as a diff base)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Report the history shape after checkout
        run: |
          printf 'after-checkout shallow=%s head_commits=%s all_commits=%s\n' \
            "$(git rev-parse --is-shallow-repository)" \
            "$(git rev-list --count HEAD)" \
            "$(git rev-list --count --all)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev,providers]"

      - name: Fetch pinned upstream metadata checkout
        run: |
          COMMIT=$(python -c "from scripts.quality.provider_model_inventory import UPSTREAM_COMMIT; print(UPSTREAM_COMMIT)")
          CHECKOUT="$RUNNER_TEMP/opendata-openbb"
          git init "$CHECKOUT"
          git -C "$CHECKOUT" fetch --depth=1 https://github.com/OpenBB-finance/OpenBB.git "$COMMIT"
          git -C "$CHECKOUT" checkout --detach FETCH_HEAD
          test "$(git -C "$CHECKOUT" rev-parse HEAD)" = "$COMMIT"
          printf 'OPENDATA_OPENBB_PATH=%s/openbb_platform\n' "$CHECKOUT" >> "$GITHUB_ENV"

      - name: Fetch pinned upstream akshare checkout for the port replay face
        run: |
          # AC-17|05 asks whether every vendored file is the deterministic replay of the upstream
          # source at the pinned commit. `upstream.lock` is the only authority for both the URL and
          # the commit, so they are read from it rather than repeated as literals here; the fetch is
          # depth-1 and the rev-parse assertion fails the job if HEAD is not exactly that commit.
          LOCK=opendata/data/providers/akshare/_vendor/upstream.lock
          URL=$(python -c "import json;print(json.load(open('$LOCK'))['upstream']['url'])")
          COMMIT=$(python -c "import json;print(json.load(open('$LOCK'))['upstream']['commit'])")
          test -n "$URL" && test -n "$COMMIT" || { echo "AC-17|05: upstream.lock carries no commit"; exit 1; }
          CHECKOUT="$RUNNER_TEMP/opendata-akshare"
          git init "$CHECKOUT"
          git -C "$CHECKOUT" fetch --depth=1 "$URL" "$COMMIT"
          git -C "$CHECKOUT" checkout --detach FETCH_HEAD
          test "$(git -C "$CHECKOUT" rev-parse HEAD)" = "$COMMIT"
          printf 'OPENDATA_AKSHARE_UPSTREAM_PATH=%s\n' "$CHECKOUT" >> "$GITHUB_ENV"
          echo "port replay upstream: $COMMIT"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install earlyoom (memory exhaustion must fail a named process, not freeze the runner)
        run: |
          sudo apt-get install -y -qq earlyoom || (sudo apt-get update -qq && sudo apt-get install -y -qq earlyoom)
          sudo systemctl disable --now earlyoom

      - name: Pull pinned MySQL image for owned browser integration
        run: |
          IMAGE=$(python -c "from tests.script_download_backend_harness import MYSQL_IMAGE_REFERENCE; print(MYSQL_IMAGE_REFERENCE)")
          docker pull "$IMAGE"

      - name: Install gitleaks (gate runs secret-check; version from the manifest)
        run: |
          VERSION=$(python -c "import json;print(json.load(open('docs/quality/secret-scan.json'))['gitleaks_version'])")
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Create data warehouse database
        run: |
          python - <<'PY'
          import pymysql
          conn = pymysql.connect(
              host="127.0.0.1", port=3306, user="root", password="ci_root_password"
          )
          with conn.cursor() as cur:
              cur.execute(
                  "CREATE DATABASE IF NOT EXISTS opendata_data "
                  "CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
              )
          conn.commit()
          conn.close()
          print("opendata_data is ready")
          PY

      - name: Verify metadata migrations apply on MySQL
        run: alembic upgrade head

      - name: Verify migrations match the models (no drift)
        run: alembic check

      # The owned-MySQL lease reports a failed `docker port` as a sha256 of stderr only
      # (correct: argv carries generated passwords). That made run 40054080199 red with
      # no readable cause. Start the same lease here first and print the diagnostics the
      # harness already redacts, so the container's own reason reaches the log.
      - name: Preflight the owned MySQL lease
        timeout-minutes: 12
        run: |
          set +e +o pipefail
          python - <<'PY'
          import sys
          import tempfile
          import traceback
          from pathlib import Path

          from tests.script_download_backend_harness import OwnedMysql

          lease = OwnedMysql()
          try:
              target = lease.start()
              print(f"PREFLIGHT: owned MySQL ready on 127.0.0.1:{target.host_port}")
          except BaseException:  # noqa: BLE001 - the verdict, not the exception, matters
              print("PREFLIGHT: owned MySQL start FAILED")
              traceback.print_exc()
              with tempfile.TemporaryDirectory() as tmp:
                  try:
                      diagnostics = lease.capture_diagnostics(Path(tmp))
                      print("PREFLIGHT diagnostics:", diagnostics)
                      logs = Path(tmp) / "mysql-container-logs-redacted.txt"
                      if logs.is_file():
                          print("---- redacted container log tail ----")
                          print(logs.read_text(encoding="utf-8")[-4000:])
                  except BaseException:  # noqa: BLE001
                      print("PREFLIGHT: diagnostics capture failed")
                      traceback.print_exc()
          finally:
              print("PREFLIGHT cleanup:", lease.cleanup())
          PY
          echo "PREFLIGHT step is advisory; the gate still owns the verdict."

      # `--sync-ratchet` freezes what *this* measurement saw, so a baseline can only
      # be produced where the environment is CI's (pinned gitleaks, MySQL service,
      # clean tree). Locally the same command yields a different cell set - here it
      # measured 13 cells including AC-13|06/AC-18|03/§6|03 and missed CI's
      # AC-16|09/AC-17|03/AC-17|05/AC-19|02 - which is exactly why an adjudicated
      # sync belongs in CI. The artifact still has to arrive as a reviewed commit.
      # The booking path must measure with the same instrument as the judgment it books against.
      # AC-5|07's ported bandit bundle is a per-round reading, not an archive: the judge validates
      # it inside a hard 24-hour window (MAX_EVIDENCE_AGE in
      # scripts/quality/ported_security_evidence.py), so a committed bundle that nobody re-scans
      # goes red on wall-clock time. `make gate` rebuilt it ahead of acceptance-probe-check
      # (#199), but this dispatch skips the whole gate, so the only member that re-scans never
      # ran here: run 42228207697 measured the aged C89 bytes, read AC-5|07 as stale-proof, and
      # the artifact offered a pin for a cell whose scan, triage coverage and source binding all
      # said yes. Rebuilding first makes the sync read AC-5|07 proven instead of pinning it.
      - name: Sync the acceptance gate ratchet (manual dispatch only)
        if: env.SYNC_ACCEPTANCE_RATCHET == 'true'
        run: |
          make security-bundle-rebuild
          python scripts/quality/acceptance_item_probe.py --sync-ratchet
          git --no-pager diff -- docs/quality/acceptance-gate-ratchet.json
      - name: Upload the synced acceptance ratchet
        if: env.SYNC_ACCEPTANCE_RATCHET == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-gate-ratchet
          path: docs/quality/acceptance-gate-ratchet.json
          retention-days: 7

      - name: Run fail-closed quality gate
        if: env.SYNC_ACCEPTANCE_RATCHET != 'true'
        timeout-minutes: 100
        run: |
          # The gate's own output goes to a file that is uploaded afterwards; the Actions
          # pipe only ever sees one short heartbeat line per 30s. Runs 40000463253,
          # 40014879802 and 40040759684 each went silent at 8.43 MB of job log - mid
          # test-cov, with xdist, this monitor and earlyoom's 60s status all stopping in
          # the same second while memory, disk and load stayed healthy - and then sat
          # there until the 120m job limit killed them. One line per collected test is
          # what filled the log. A stalled gate must name the member it stalled in.
          LOG="${{ runner.temp }}/gate.log"
          : > "$LOG"
          heartbeat() {
            set +e +o pipefail
            local started=$SECONDS
            while sleep 30; do
              local elapsed=$(( SECONDS - started )) size
              size=$(( $(stat -c%s "$LOG" 2>/dev/null || echo 0) / 1024 ))
              printf '[beat %dm%02ds] log=%dKB member=%s tail=%s mem=%sMB procs=%s load=%s\n' \
                "$(( elapsed / 60 ))" "$(( elapsed % 60 ))" "$size" \
                "$(grep -a '===== gate:' "$LOG" | tail -n 1 | sed -e 's/.*gate: //' -e 's/ =====.*//')" \
                "$(LC_ALL=C tail -c 90 "$LOG" | tr -cd '[:print:]' | tr '#' '_' | tr '\n' ' ')" \
                "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)" \
                "$(ps -e --no-headers | wc -l)" \
                "$(cut -d' ' -f1 /proc/loadavg)"
            done
          }
          heartbeat &
          heartbeat_pid=$!
          # Process names only in the log: command lines can carry the owned-MySQL harness's
          # generated passwords, so nothing here echoes a full argv.
          sudo earlyoom -r 60 -m 8,4 -s 100,100 -p \
            --avoid '^(Runner\.Worker|Runner\.Listener|provjobd[0-9]*|dockerd|containerd|mysqld|systemd.*|earlyoom)$' \
            >> "$LOG" 2>&1 &
          earlyoom_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null; sudo kill "$earlyoom_pid" 2>/dev/null; true' EXIT
          status=0
          make gate > "$LOG" 2>&1 || status=$?
          set +e +o pipefail
          kill "$heartbeat_pid" 2>/dev/null
          sudo kill "$earlyoom_pid" 2>/dev/null
          echo "===== gate finished with status $status ====="
          echo "::group::gate member progress"
          grep -aE '^===== gate:|^Required test coverage|^TOTAL|passed.*[0-9]+s$|Test failed' "$LOG" | tail -n 40
          echo "::endgroup::"
          echo "::group::failing member output"
          last_marker=$(grep -an '===== gate:' "$LOG" | tail -n 1 | cut -d: -f1)
          sed -n "${last_marker:-1},\$p" "$LOG" | tail -n 250 | cut -c1-500
          echo "::endgroup::"
          free -m
          df -h / | sed -n '2p'
          exit "$status"

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: ${{ runner.temp }}/gate.log
          retention-days: 14
          if-no-files-found: ignore

      # The AC21 node's own finally-block writes redacted container logs and the runtime
      # inspect here, so a failed owned-MySQL start is readable after the run.
      - name: Upload the owned-MySQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac21-evidence
          path: docs/evidence/C100/frontend-download/runs
          retention-days: 14
          if-no-files-found: ignore

      - name: Runner diagnostics after the gate
        if: always()
        run: |
          set +e +o pipefail
          free -m
          df -h /
          # Run 41335236551 measured `shallow=false head_commits=976` at gate start and
          # `shallow=true head_commits=5` here, so this names the shape the probe actually judged.
          printf 'after-gate shallow=%s head_commits=%s all_commits=%s\n' \
            "$(git rev-parse --is-shallow-repository)" \
            "$(git rev-list --count HEAD)" \
            "$(git rev-list --count --all)"
          sudo dmesg -T | grep -iE 'out of memory|oom-kill|killed process' | tail -n 20
          ps -eo pid=,ppid=,nlwp=,rss=,etimes=,comm= --sort=-rss | sed -n '1,15p'
