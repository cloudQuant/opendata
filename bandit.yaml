# Bandit security scanner configuration
# https://bandit.readthedocs.io/

# Directories to exclude from scanning
#
# C35: bandit matches these entries as substrings of the path, at any depth and
# *even for files passed explicitly on the command line* - so the old bare
# "akshare" kept opendata/data/providers/akshare/ (15 first-party modules) out
# of both `make security` and a2-check's bandit leg, which is the leg that
# gates new code. Rule: no entry here may be a substring of a first-party path
# segment. (An anchored form like "/akshare" would match nothing at all.)
exclude_dirs:
  - ".git"
  - "__pycache__"
  - "node_modules"
  # Nested upstream source has a separate ported audit. The exact prefix keeps
  # the first-party adapter under the same provider in the regular scan.
  - "opendata/data/providers/akshare/_vendor/"

# No global `skips:` list. C81 moved every exemption onto the line that earns it
# (`# nosec B<id>  # <reason>`): a config-wide skip silences the rule for the whole
# tree, including code nobody has reviewed, and it makes the report's zero say less
# than "these lines were checked and justified". a2-check's bandit leg fails on any
# finding that is not exempted line by line.
