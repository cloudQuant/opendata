# Dedicated financial observation archive. No default URL is configured here.
# The target must be supplied explicitly as an Alembic x-argument:
#   alembic -c alembic_financial_archive.ini \
#     -x financial_archive_url='mysql+pymysql://...' upgrade head
# SQLite is accepted only for an in-memory target or a temporary file named
# test_financial_archive_*.db/.sqlite. This chain is independent from both
# application and warehouse migration histories.

[alembic]
script_location = %(here)s/alembic_financial_archive
version_table = alembic_version_financial_archive
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
