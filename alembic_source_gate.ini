# Independent migration chain for the file-backed source-attempt gate.
# The existing SQLite file must be named explicitly through the CLI tool or
# the Alembic source_gate_path argument. There is intentionally no default URL.

[alembic]
script_location = %(here)s/alembic_source_gate
prepend_sys_path = %(here)s
version_table = alembic_version_source_gate
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
