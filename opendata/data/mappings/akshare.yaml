# akshare source field mapping (design §8.2 口径映射表).
#
# Per domain: the contract key, the source-column/contract-field
# table (with the unit conversion the source needs) and per-field
# tolerances for the cross-check. Column names are the real upstream
# spellings, taken from the recorded fidelity fixtures (A2.5) - never
# guessed. Adding a field here is a reviewed edit; a source column
# that is not listed is dropped from the contract view, and a mapped
# column the frame lacks fails the normalization closed.
version: 1
source: akshare
domains:
  stock_daily:
    key: [symbol, trade_date]
    # 复权基准：这一腿的取数默认不复权 —— 查询模型 `adjust: str = ""`
    # （opendata/data/providers/akshare/models/stock_daily.py:23，docstring 写明
    # "unadjusted by default"），且 ods 表根本没有 `adjusted` 列可以声明别的基准，
    # 所以交付的就是不复权价（与 D10 一致，查询层可对这一域合成复权）。
    # 停牌语义实测：200 个抽样标的、19,265 行里 zero_close=0，而落在自身
    # [first,last] 与本腿市场日交集内的缺行有 55 天（10/200 个标的）——停牌日
    # 整行不发，与 ths 腿同形，所以两腿的 missing 行可以互相比对。
    # 同一次实测另有 38 行「价>0 而量、额同为 0」：那是 sina 退路缺额度的已知
    # 缺陷（C24），不是停牌语义，登记为待修，没有写进这里的声明。
    adjust: unadjusted
    suspension: absent_row
    denominator: key_union
    fields:
      symbol: {from: 股票代码, normalize: plain}
      trade_date: {from: 日期}
      open: {from: 开盘}
      high: {from: 最高}
      low: {from: 最低}
      close: {from: 收盘}
      # 成交量 arrives in lots (手); the contract stores shares.
      volume: {from: 成交量, scale: 100}
      amount: {from: 成交额}
    tolerances:
      open: 0.0001
      high: 0.0001
      low: 0.0001
      close: 0.0001
  index_constituent:
    key: [index_symbol, symbol, as_of]
    # 成分权重快照：一行一个「指数 × 成分券 × 日期」，没有价格序列，
    # 因此复权基准与停牌语义都不适用（停牌成分券在权重表里照样有一行，
    # 缺行只发生在指数本身没有发布权重的日子）。
    adjust: not_applicable
    suspension: not_applicable
    denominator: key_union
    fields:
      index_symbol: {from: 指数代码, normalize: plain}
      symbol: {from: 成分券代码, normalize: plain}
      as_of: {from: 日期}
      weight: {from: 权重}
    tolerances:
      weight: 0.0001
  # 财务报表（新浪三张表）与财务指标（东财 F10 主财务）都是宽帧：一行一个报告期、
  # 一列一个科目。这两域的「哪些列是科目」由上游页面自己决定，本平台没有做中文/大写
  # 字段名 → normalized code 的映射，所以 pivot.mode=passthrough——除页头元数据外，
  # 每一列都按上游原名落 item / indicator。这与 ths 腿的英文名不同形是**声明过的事实**
  # （AC-4 登记的合并 key 缺口），不是这里的疏漏。
  financial_statement:
    key: [symbol, statement_type, report_period, item]
    # 复权基准：报表数没有价格序列，停牌语义见下——两腿的行形状还没统一，无从实测。
    # 停牌语义 = unmeasured：这一域的缺行是某一期没有披露，不是标的停牌；且 sina 腿的
    # item 是中文科目名、statement_type 是中文披露名，与 ths 腿不共享合并 key（AC-4），
    # 两腿的行数因此不可比。读方 require_comparable_calibers 拒绝 unmeasured。
    adjust: not_applicable
    suspension: unmeasured
    denominator: key_union
    pivot:
      mode: passthrough
      item_field: item
      value_field: value
      # 一页只给一张表，表名来自请求参数（资产负债表 / 利润表 / 现金流量表）；帧里的
      # 「类型」列是页头信息，落在 excluded 里，不作为科目。
      group_field: statement_type
      # 行级字段从宽帧的哪一列读：摊平器读这两列时用的就是这里的名字，不是硬编码。
      row_columns:
        report_period: 报告日
        announce_date: 公告日期
      # 实测的页头元数据列（其余未列出的列即科目）。报告日/公告日期不在这里重复：
      # 它们被上面当行字段读走了，line_items 自然不会再当成科目。
      excluded: [数据源, 是否审计, 币种, 类型, 更新日期]
    # 长视图与契约同名（这一域还没有 ods_financial_statement_* 表：A4.1 迁移只建了
    # 日线四件套与目录）。symbol 的 plain 归一记的是「这一腿的请求参数带交易所后缀」
    # （600519.SH -> 600519），摊平后落裸码。
    fields:
      symbol: {from: symbol, normalize: plain}
      statement_type: {from: statement_type}
      report_period: {from: report_period}
      announce_date: {from: announce_date}
      item: {from: item}
      value: {from: value}
      revision: {from: revision}
  financial_indicator:
    key: [symbol, report_period, indicator]
    # 东财 F10 主财务：一行一个报告期，列是 EPSJB / BPS / ROEJQ 这类上游字段码。
    # 复权基准不适用（不是价格序列）；停牌语义 unmeasured——这一腿只有 em 一条，
    # 没有第二条腿可比，且指标行缺不缺与停复牌无关。
    adjust: not_applicable
    suspension: unmeasured
    denominator: key_union
    pivot:
      mode: passthrough
      item_field: indicator
      value_field: value
      # 一个数据集就是一整个指标序列，没有分组字段：报告期与披露日期都从帧里读。
      # NOTICE_DATE 是契约要求的披露日，摊平前先按它检查列在不在（缺失即失败关闭）。
      row_columns:
        report_period: REPORT_DATE
        announce_date: NOTICE_DATE
      # SECUCODE 是页内的标的列（身份由请求参数给，不用它）；字符串型指标列（如
      # 评级、备注）在数值化时被自然丢弃，不靠这里的名单排除。
      excluded: [SECUCODE]
    # 指标值单位（元、元/股、%）在这一腿是混着的，且没有实测过逐列口径，所以契约的
    # unit 字段留 None——单位换算 scale 这一格在这里是空的，不是被省略的默认值。
    fields:
      symbol: {from: symbol, normalize: plain}
      report_period: {from: report_period}
      announce_date: {from: announce_date}
      indicator: {from: indicator}
      value: {from: value}
      unit: {from: unit}
      revision: {from: revision}
