# fuyao (THS) source field mapping (design §8.2 口径映射表).
#
# Column names are the real Parquet spellings from the market-dumps that
# A3.3 pulled from the live API - never guessed. The daily K dump keeps
# the unadjusted basis only (D10); the adjustment dump carries the event
# columns and the ods table adds a derived ``event_key`` for idempotency.
#
# Adding a field here is a reviewed edit; a source column that is not
# listed is dropped from the contract view, and a mapped column the frame
# lacks fails the normalization closed.
version: 1
source: ths
domains:
  stock_daily:
    key: [symbol, trade_date]
    # 复权基准实测：ods_stock_daily_ths 全表 `SELECT DISTINCT adjusted` 只有
    # 'none' 一个取值（scripts/ops/suspension_shape_check.py，C53），与 D10 的
    # 「只存不复权、查询时合成」一致，所以查询层可以对这一域动复权合成。
    # 停牌语义实测：200 个抽样标的、475,402 行里 zero_close=0，而落在自身
    # [first,last] 与本腿市场日交集内的缺行有 8,240 天（139/200 个标的至少一天）
    # —— 停牌日整行不发，不是发一行 0 价。
    adjust: unadjusted
    suspension: absent_row
    # 差异率分母：比对按两侧业务 key 的并集计数（cross_check.compare_normalized），
    # 写成表字段后它不再由实现决定。
    denominator: key_union
    fields:
      symbol: {from: thscode, normalize: plain}
      trade_date: {from: trade_date, ms_column: date_ms}
      open: {from: open_price}
      high: {from: high_price}
      low: {from: low_price}
      close: {from: close_price}
      volume: {from: volume}
      amount: {from: turnover}
    tolerances:
      open: 0.0001
      high: 0.0001
      low: 0.0001
      close: 0.0001
  stock_action:
    key: [symbol, ex_date]
    # 除权除息事件表：一行一个事件，没有价格序列，所以「以什么复权基准交付」与
    # 「停牌日长什么样」都不适用；它是复权因子的来源，不是被复权的对象。
    adjust: not_applicable
    suspension: not_applicable
    denominator: key_union
    fields:
      symbol: {from: thscode, normalize: plain}
      ex_date: {from: ex_date}
      cash_dividend: {from: dividend_per_share}
      stock_dividend: {from: per_share_bonus}
      rights_shares: {from: allotment_ratio}
      rights_price: {from: allotment_price}
    tolerances:
      cash_dividend: 0.000001
      stock_dividend: 0.000001
  # 指数日线：REST item 与股票 K 线同构，但指数无复权语义（上游 data.adjust
  # 恒为 null），故没有 adjust 字段；成交量单位是股、成交额是元，与契约一致，
  # 不需要 scale（区别于 akshare 侧的“手”）。
  index_daily:
    key: [symbol, trade_date]
    # 复权基准：上游对指数 K 线恒发 data.adjust=null（A3.3/C9 留档），指数没有
    # 除权除息事件可合成，所以这一域不是「未复权价」而是「无复权语义」——
    # 查询层据此拒绝 qfq/hfq（require_adjust_basis）。
    # 停牌语义：指数是由成分券计算出来的数值，本身没有停复牌状态，
    # 非交易日整行不发行是交易日历的结果，不是标的停牌。
    adjust: not_applicable
    suspension: not_applicable
    denominator: key_union
    fields:
      symbol: {from: thscode, normalize: plain}
      trade_date: {from: trade_date, ms_column: date_ms}
      open: {from: open_price}
      high: {from: high_price}
      low: {from: low_price}
      close: {from: close_price}
      volume: {from: volume}
      amount: {from: turnover}
    tolerances:
      open: 0.0001
      high: 0.0001
      low: 0.0001
      close: 0.0001
  # 期货/期权日 K：上游 item 的日期字段叫 timestamp（不是 date_ms），其余与
  # 股票/指数 K 线同源。合约标识保留交易所后缀（IF2610.CFE / 90007464.SZ）：
  # 衍生品交易所是标的身份的一部分，剥后缀会让 90007464 这类不透明数字码失去
  # 可读性与跨所唯一性，故这两域不做 plain 归一（区别于 A 股/指数）。
  futures_daily:
    key: [symbol, trade_date]
    # 单一合约（IF2610.CFE）没有公司行为，除权除息只属于股票/ETF 那一域：
    # 「主力换月连续合约」是另一件事，本平台没有这个域，故不复权语义不适用。
    # 停牌语义 = unmeasured：这一腿的 K 线行从未落 ods（库里没有
    # ods_futures_daily_ths），行形状无从实测；unmeasured 是「表记下了这一格还没
    # 有证据」，任何读取方都会拒绝它（require_comparable_calibers），所以它不会被
    # 当成「已确认没有停牌」来参与双源比对。
    adjust: not_applicable
    suspension: unmeasured
    denominator: key_union
    fields:
      symbol: {from: thscode}
      trade_date: {from: trade_date, ms_column: timestamp}
      open: {from: open_price}
      high: {from: high_price}
      low: {from: low_price}
      close: {from: close_price}
      volume: {from: volume}
      amount: {from: turnover}
    tolerances:
      open: 0.0001
      high: 0.0001
      low: 0.0001
      close: 0.0001
  option_daily:
    key: [symbol, trade_date]
    # 与期货同因：单一合约码（90007464.SZ）没有公司行为可合成复权。停牌语义
    # unmeasured：期权腿同样没有 ods 行可量，且非活跃合约在换月/到期前后必然缺行，
    # 这一格要的是真机实测而不是推测。
    adjust: not_applicable
    suspension: unmeasured
    denominator: key_union
    fields:
      symbol: {from: thscode}
      trade_date: {from: trade_date, ms_column: timestamp}
      open: {from: open_price}
      high: {from: high_price}
      low: {from: low_price}
      close: {from: close_price}
      volume: {from: volume}
      amount: {from: turnover}
    tolerances:
      open: 0.0001
      high: 0.0001
      low: 0.0001
      close: 0.0001
  # 财务报表：上游一行一个报告期、一列一个科目，而契约与 dwd 都是长表（主键
  # symbol / statement_type / report_period / item，见 A4.1 迁移的 _DWD_TABLES）。
  # 「哪些列是科目」是这一域自己的口径，所以宽→长必须在表里声明：mode=groups 由
  # 表逐组列出科目名，响应自己的键说了不算。
  financial_statement:
    key: [symbol, statement_type, report_period, item]
    # 复权基准：报表数没有价格序列，也没有除权除息事件可合成，所以不是「未复权」
    # 而是「无复权语义」；查询层据此拒绝 qfq/hfq（require_adjust_basis）。
    # 停牌语义 = unmeasured：这一域的缺行是某一期没有披露，不是标的停牌；两腿的
    # item / statement_type 取值还没统一（AC-4 登记的缺口），行形状无从对齐实测。
    # 读方 require_comparable_calibers 拒绝 unmeasured，所以两腿不会被拿去比对。
    adjust: not_applicable
    suspension: unmeasured
    # 差异率分母与日线各域同一条（两侧业务 key 的并集）。这一格今天还不被执行
    # ——停牌语义先拒绝了比对——写进来是为了让分母不再由实现决定。
    denominator: key_union
    pivot:
      mode: groups
      item_field: item
      value_field: value
      # 一次响应只给一张表，表名是请求参数而不是帧里的一列，故由 group_field 指
      # 定它落在哪个 key 字段上：两张表的科目不能共享同一个业务 key。
      group_field: statement_type
      # 披露日只有毫秒列（响应里没有日期列），摊平时按 ms 换算。报告期末是
      # fiscal_year + fiscal_period 推出来再与 period_end_ms 对账的：两列合成一个
      # 字段不是 1:1 的表能声明的，所以它留在代码里（_financial_report_period）。
      row_columns:
        announce_date: report_date_ms
      # 2026-09-25 实测三张表的完整键集，减去共有元数据键 thscode / ticker /
      # period / fiscal_year / fiscal_period / report_date_ms / period_end_ms /
      # currency。落库取上游英文名：契约 FinancialStatement.item 要的是
      # normalized item code，上游给的正是这一层（docs/evidence/C10）。
      groups:
        income:
          - operating_income
          - operating_costs
          - operating_expenses
          - sales_fee
          - manage_fee
          - research_and_development_expenses
          - operating_profit
          - interest_expenses
          - profit_total
          - income_tax_expense
          - net_profit
          - parent_holder_net_profit
          - basic_eps
        balance:
          - assets_total
          - total_current_assets
          - non_current_nets_total
          - cash
          - accounts_receivable
          - total_debt
          - holder_equity_total
        cashflow:
          - act_cash_flow_net
          - invest_cash_flow_net
          - financing_cash_flow_net
          - pay_fixed_assets_etc_cash
          - pay_dividends_profits_interest_cash
          - cash_equivalents_net_addition
    # fields 是**摊平之后**的长表视图：这一域还没有 ods_financial_statement_ths
    # 表（A4.1 迁移只建了日线四件套与目录），所以这里写的不是某张 ods 表的列名
    # 拼写，而是长视图与契约同名的那一层。宽帧里没有任何一列叫 item，
    # normalize_frame 拿它做 1:1 投影必然失败关闭——这是设计要的，不是意外。
    fields:
      symbol: {from: symbol, normalize: plain}
      statement_type: {from: statement_type}
      report_period: {from: report_period}
      announce_date: {from: announce_date}
      item: {from: item}
      value: {from: value}
      revision: {from: revision}
