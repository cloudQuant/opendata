# OpenBB 接口名 ↔ 本项目接口名对照表（FR-7 / AC-10，设计 §10.4）。
#
# 只描述契约，不含实现。准入规则（AC-10）：每个**已启用**（注册）的
# provider×domain 必须出现在某条目中，且每个条目的 scenario 非空——
# 标不出消费场景的能力不进本表（tests/test_openbb_map.py 强制）。
#
# OpenBB 模型名只写**确凿**的名字：来自对上游各 provider 包
# ``Provider(fetcher_dict=...)`` 声明的机械解析（见
# docs/proposals/openbb-migration/provider-inventory.yaml，基线
# openbb_platform @ 3e071fcc）。未从该清单确认的名字一律写 ``TBD``，
# 待从上游公开文档核实后替换——不猜测接口名。
version: 1
entries:
  - openbb: {model: EquityHistorical}
    scenario: 行情日线（回测数据准备 / dwd 日线域）
    ours:
      - {provider: ths, domain: stock_daily, contract: Bar, status: verified}
      - {provider: akshare, domain: stock_daily, contract: Bar, status: registered}
      - {provider: yfinance, domain: stock_daily_overseas, contract: OverseasBar, status: registered}
  - openbb: {model: ConsumerPriceIndex}
    scenario: 宏观 CPI（AI 研究 / 资产配置）
    ours:
      - {provider: ecb, domain: economy_cpi, contract: MacroSeries, status: verified}
      - {provider: fred, domain: economy_cpi, contract: MacroSeries, status: registered}
      - {provider: imf, domain: economy_cpi, contract: MacroSeries, status: verified}
      - {provider: oecd, domain: economy_cpi, contract: MacroSeries, status: verified}
  - openbb: {model: TBD}
    scenario: 宏观 GDP（AI 研究 / 资产配置）
    ours:
      - {provider: ecb, domain: economy_gdp, contract: MacroSeries, status: verified}
      - {provider: fred, domain: economy_gdp, contract: MacroSeries, status: registered}
      - {provider: imf, domain: economy_gdp, contract: MacroSeries, status: verified}
  - openbb: {model: TBD}
    scenario: 宏观失业率（AI 研究 / 资产配置）
    ours:
      - {provider: imf, domain: economy_unemployment, contract: MacroSeries, status: verified}
      - {provider: oecd, domain: economy_unemployment, contract: MacroSeries, status: verified}
      - {provider: fred, domain: economy_unemployment, contract: MacroSeries, status: registered}
  - openbb: {model: TBD}
    scenario: 宏观利率（AI 研究 / 资产配置 / 回测融资成本）
    ours:
      - {provider: ecb, domain: economy_rate, contract: MacroSeries, status: verified}
  - openbb: {model: FuturesHistorical}
    scenario: 期货日线（期货回测数据准备 / dwd 期货域）
    ours:
      - {provider: akshare, domain: futures_daily, contract: Bar, status: registered}
  - openbb: {model: EtfHistorical}
    scenario: ETF 日线（场内基金回测数据准备 / dwd ETF 域）
    ours:
      - {provider: akshare, domain: fund_etf_daily, contract: Bar, status: registered}
  - openbb: {model: TBD}
    scenario: 指数日线（业绩基准与指数增强回测 / dwd 指数域）
    ours:
      - {provider: akshare, domain: index_daily, contract: Bar, status: registered}
  - openbb: {model: TBD}
    scenario: 期权合约日线（期权策略回测数据准备 / dwd 期权域）
    ours:
      - {provider: akshare, domain: option_daily, contract: Bar, status: registered}
  - openbb: {model: TBD}
    scenario: 可转债日线（转债轮动策略数据准备 / dwd 债券域）
    ours:
      - {provider: akshare, domain: bond_daily, contract: Bar, status: registered}
  - openbb: {model: TBD}
    scenario: 除权除息事件（dwd 事件域）
    ours:
      - {provider: ths, domain: stock_action, contract: CorporateAction, status: verified}
      - {provider: akshare, domain: stock_action, contract: CorporateAction, status: registered}
  - openbb: {model: TBD}
    scenario: 财务报表（dwd 财务域）
    ours:
      - {provider: akshare, domain: financial_statement, contract: FinancialStatement, status: registered}
      - {provider: ths, domain: financial_statement, contract: FinancialStatement, status: pending}
  - openbb: {model: TBD}
    scenario: 财务指标（dwd 财务域）
    ours:
      - {provider: akshare, domain: financial_indicator, contract: FinancialIndicator, status: registered}
      - {provider: ths, domain: financial_indicator, contract: FinancialIndicator, status: pending}
  - openbb: {model: TBD}
    scenario: 指数成分股（dwd 指数域）
    ours:
      - {provider: akshare, domain: index_constituent, contract: IndexConstituent, status: registered}
      - {provider: ths, domain: index_constituent, contract: IndexConstituent, status: pending}
