[pytest]
testpaths = tests
# The in-repo client package (design §10.4) is a sibling of the app.
pythonpath = .
    opendata_client
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    --strict-markers
    --tb=short
    -v
    --cov=opendata
    --cov-report=term-missing
    --cov-report=html
    -p no:warnings
markers =
    asyncio: mark test as async
    unit: mark test as unit test
    integration: mark test as integration test
    slow: mark test as slow running
    e2e: mark test as end-to-end (requires a running application)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
